languages:
  - name: Swift
    version: "6"
    note: strict concurrency attiva
frameworks:
  - name: SwiftUI
    note: viste dell'app
  - name: AppKit
    note: finestre fluttuanti, eventi globali, integrazione con il sistema
  - name: macOS SDK
    version: "26"
    note: deployment target macOS 26 Tahoe, solo Apple Silicon
  - name: OMP (omp --mode rpc)
    note: agente AI locale, avviato come processo figlio e guidato via RPC JSON (protocollo v2) con strumenti host
  - name: MLX Swift
    note: esecuzione locale del modello di embedding; da verificare e ottimizzare
  - name: EmbeddingGemma 2
    note: modello di embedding (variante solo testo); se non gira bene su MLX si sceglie un altro modello supportato da MLX
  - name: Accessibility API
    note: lettura di app, finestre, documenti e testo visibile
  - name: ScreenCaptureKit
    chosenByAgent: API di sistema attuale per catturare una finestra prima del riconoscimento del testo
  - name: Vision
    chosenByAgent: riconoscimento del testo sul Mac, senza dipendenze esterne
  - name: PDFKit
    chosenByAgent: lettura del testo dei PDF inclusa in macOS
  - name: WebKit
    chosenByAgent: WKWebView genera il PDF di una pagina web riaprendone l'indirizzo
  - name: GRDB.swift
    chosenByAgent: accesso a SQLite tipizzato e maturo in Swift, con supporto a FTS5 e alle migrazioni
  - name: KeyboardShortcuts
    chosenByAgent: libreria diffusa per scorciatoie globali registrabili dall'utente in SwiftUI
data:
  - name: SQLite
    note: database del vault in Application Support
    chosenByAgent: un file locale, nessun server, ricerca a testo pieno integrata
  - name: SQLite FTS5
    note: ricerca a testo pieno
    chosenByAgent: integrato in SQLite, ranking BM25
  - name: sqlite-vec
    note: vettori degli embedding per la ricerca semantica
    chosenByAgent: tiene vettori e testo nello stesso database locale
  - name: File system
    note: copie dei documenti, modello e sessioni OMP in ~/Library/Application Support/Axi
  - name: Keychain
    note: chiave di Azure Document Intelligence
testing:
  - name: Swift Testing
    note: test unitari e di integrazione nei pacchetti, con documenti d'esempio
ci:
  - name: GitHub Actions
    note: build e test su runner macOS a ogni push e pull request
repository:
  - name: GitHub
    note: repository pubblico, licenza AGPL-3.0
deployment:
  - name: Build locale
    note: per ora app compilata in locale e non firmata; in seguito firma Developer ID e notarizzazione fuori dal Mac App Store
cloud:
  - name: Azure AI Document Intelligence
    note: opzionale, configurato dall'utente con endpoint e chiave; nessuna risorsa gestita dal progetto
notes: |
  - Solo macOS: nessun supporto a Windows o Linux.
  - Nessun backend proprio e nessun file di infrastruttura: tutto gira sul Mac, l'AI passa da OMP.
  - Licenza AGPL-3.0: uso libero; le aziende che vogliono una licenza commerciale contattano l'autore.
  - App Sandbox disattivata, Hardened Runtime attivo, in vista della notarizzazione.
